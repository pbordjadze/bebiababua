# Grandma's channel list. Order = channel numbers (1, 2, 3, ...) unless a
# channel sets `number`. Only what is listed here appears on the TV.
#
# Find the exact names your provider uses with:
#   tools/babua list-source provider -g rustavi
# and check the result before deploying with:
#   tools/babua preview
#
# Per channel:
#   name      what she sees (Georgian / Russian, whatever she knows it as)
#   match     provider channel name(s), case-insensitive; first hit wins
#   match_re  regular expression on the provider name (alternative to match)
#   tvg_id    match on the provider's tvg-id instead
#   url / url_env   a direct stream instead of the provider (url_env = a
#             variable in site/secrets.env, for URLs that contain tokens)
#   source    restrict the lookup to one [sources.*] entry
#   group     "ქართული" / "Русские" - shown as channel groups in Kodi
#   logo      file in config/logos/ or a URL; default: the provider's logo
#   epg_id    override tvg-id for the programme guide
#   kodiprops extra #KODIPROP lines, e.g. ["inputstream=inputstream.adaptive"]
#
# NOTE: names/matches below are placeholders - replace them with what
# the subscription actually contains (see docs/VERIFY.md).

[sources.provider]
url_env = "IPTV_M3U_URL"

# Test channel for setting up before the subscription is sorted (public test
# stream, H.264 720p; it's a ~10 min clip, not live). Remove when done.
[[channel]]
name = "Тест"
url = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
number = 99

# A second source can serve as a fallback for channels the provider lacks:
# [sources.backup]
# url_env = "IPTV_BACKUP_M3U_URL"

# ---------------------------------------------------------------- Georgian
