# babua behaviour - committed, no secrets. Site specifics and credentials go
# in site/secrets.env. Changes reach the box with `tools/babua deploy`.

HOSTNAME=babua-tv
# LibreELEC system timezone (also used for the weekly reboot / stream check times)
TIMEZONE=America/New_York

# Kodi has no Georgian UI translation; Russian is complete. Channel names
# themselves can be Georgian (the "Arial" font set has Georgian glyphs).
KODI_LANGUAGE=resource.language.ru_ru

# TV switched off / remote STOP -> blank (dim) screen instead of a menu
BLANK_WHEN_STOPPED=1
# Screen woken by TV power-on or any key -> play the last channel
RESUME_ON_WAKE=1
# TV switched on -> switch it to the Pi's HDMI input (once per power-on;
# another input picked afterwards is left alone)
CLAIM_TV_INPUT=1
# TV in standby for 5 min while a channel plays -> stop it (no streaming all night;
# the channel comes back when the TV is turned on)
STOP_WHEN_TV_OFF=1
# Monday 04:30 reboot when nothing is playing
WEEKLY_REBOOT=1

# Shown on the TV when a channel fails repeatedly
MSG_CHANNEL_DOWN=Канал сейчас не работает. Выберите другой. / არხი ახლა არ მუშაობს.
# Shown instead when the box has no internet at all (it keeps retrying by itself)
MSG_NO_INTERNET=Нет интернета. Изображение вернётся само. / ინტერნეტი არ არის.
