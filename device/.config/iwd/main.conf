# iwd settings (read at iwd start; see iwd.config(5)). iwd reads this file
# instead of /etc/iwd because of system.d/iwd.service.d/babua.conf.

[Rank]
# 2.4 GHz only. At grandma's (Eero mesh, one name for both bands) the Pi 3's
# 5 GHz link held a good signal but collapsed under streaming load: 74 KB/s,
# half the pings to the router lost. On 2.4 GHz: 4.1 MB/s, no loss.
# 0.0 takes 5 GHz access points out of iwd's choice altogether.
BandModifier5GHz=0.0
