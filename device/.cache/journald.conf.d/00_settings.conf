# babua: keep the journal across reboots, so the minutes before a crash or a
# power cut can be read afterwards (`journalctl -b -1`). This file is
# LibreELEC's own switch: when it exists, var-log.mount binds
# /storage/.cache/log onto /var/log at boot.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=500M
SystemMaxFileSize=16M
# LibreELEC's journald.conf sets MaxRetentionSec=0: kept until the size cap
# Written to the SD card every 15 s (default 5 min) so a power cut loses
# little; messages of priority CRIT and above are written at once anyway.
SyncIntervalSec=15s
